name: Revisar secretos

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Revisar archivos publicables sin mostrar secretos
        run: python3 scripts/security/verificar-secretos.py
