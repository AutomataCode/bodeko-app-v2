spring.application.name=bodeko

spring.config.import=optional:file:.env.dev[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

app.frontend-url=${FRONTEND_URL:http://localhost:3000}

spring.flyway.enabled=true


culqi.api-url=${CULQI_API_URL:https://api.culqi.com/v2}
culqi.secret-key=${CULQI_SECRET_KEY:}

mail.provider=${MAIL_PROVIDER:log}
mail.from=${MAIL_FROM:Bodeko <onboarding@resend.dev>}
mail.resend.api-url=${RESEND_API_URL:https://api.resend.com}
mail.resend.api-key=${RESEND_API_KEY:}
